[package]
name = "game-engine"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["Akshey D"]
description = "Rust Game Engine"
license = "MIT"
repository = "https://github.com/aksheyd/Game-Engine"
readme = "README.md"
publish = false
keywords = ["game-engine", "graphics", "opengl"]
categories = ["game-engines", "graphics", "rendering::engine"]

[dependencies]
bytemuck = "1"
glam = "0.33"
glow = "0.17"
glutin = "0.32.3"
glutin-winit = "0.5.0"
mlua = { version = "0.11", features = ["lua54", "vendored"] }
png = "0.18"
raw-window-handle = "0.6.2"
serde = { version = "1", features = ["derive"] }
toml = "1"
winit = "0.30.13"
