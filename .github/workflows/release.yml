name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Every OS and Node version CI covers, on the tagged commit, so a release can't skip a leg that fails.
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  # The tarball npm gets comes from here, with install scripts off, so the only dependency code that runs is the TypeScript compiler.
  build:
    name: Build the package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      integrity: ${{ steps.pack.outputs.integrity }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # setup-node turns on npm's cache by itself once package.json names npm as its package manager, and nothing here should come from a cache.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26'
          package-manager-cache: false

      - run: npm ci --ignore-scripts

      - name: Check that the tag names the version in package.json
        run: test "$GITHUB_REF_NAME" = "v$(node -p "require('./package.json').version")"

      - run: npm run build

      - name: Pack
        id: pack
        run: |
          mkdir package
          npm pack ./dist --pack-destination package --json > pack.json
          echo "integrity=$(node -p "require('./pack.json')[0].integrity")" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package
          path: package
          if-no-files-found: error

  # A second build from its own checkout, which test:package installs and uses; publish checks that it packed the same bytes.
  test:
    name: Build again and prove the package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      integrity: ${{ steps.package.outputs.integrity }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26'
          cache: npm

      - run: npm ci

      - uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2.2.0
        id: chrome

      - name: Let Chrome's sandbox run
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          unshare --user --map-root-user true

      # Naming bash adds pipefail, without which tee would hide a failing test:package.
      - name: Build, pack, and prove the package
        id: package
        shell: bash
        run: |
          npm run test:package | tee package.log
          echo "integrity=$(sed -n 's/^ok - packed .* (\(sha512-.*\))$/\1/p' package.log)" >> "$GITHUB_OUTPUT"
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}

  publish:
    name: Publish to npm
    needs: [ci, build, test]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Only this job can sign in to npm through trusted publishing, and it runs no dependency code: it checks the build job's tarball and publishes it.
    permissions:
      contents: read
      id-token: write
    steps:
      # Trusted publishing needs npm 11.5.1 or later, which Node 26 comes with.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package
          path: package

      - name: Check that both builds packed this tarball
        env:
          BUILT: ${{ needs.build.outputs.integrity }}
          TESTED: ${{ needs.test.outputs.integrity }}
        run: |
          downloaded="sha512-$(openssl dgst -sha512 -binary "./package/threejam-${GITHUB_REF_NAME#v}.tgz" | base64 -w0)"
          printf 'built      %s\ntested     %s\ndownloaded %s\n' "$BUILT" "$TESTED" "$downloaded"
          test -n "$BUILT" && test "$TESTED" = "$BUILT" && test "$downloaded" = "$BUILT"

      # Without ./ npm would read the path as a GitHub repository.
      - name: Publish
        run: npm publish "./package/threejam-${GITHUB_REF_NAME#v}.tgz"
