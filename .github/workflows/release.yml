name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Every OS and Node version CI covers, on the tagged commit, so a release can't skip a leg that fails.
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  test:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26'
          cache: npm

      - run: npm ci

      - name: Check that the tag names the version in package.json
        run: test "$GITHUB_REF_NAME" = "v$(node -p "require('./package.json').version")"

      - uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2.2.0
        id: chrome

      - name: Let Chrome's sandbox run
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: Typecheck
        run: npx tsc -p .

      - name: Test
        run: npm test
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}

      - name: Build, pack, and prove the package
        run: npm run test:package
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist
          if-no-files-found: error

  publish:
    name: Publish to npm
    needs: [ci, test]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Only this job can sign in to npm through trusted publishing, and it runs no dependency code, just npm publish on the tested build.
    permissions:
      contents: read
      id-token: write
    steps:
      # Trusted publishing needs npm 11.5.1 or later, which Node 26 comes with.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26'
          registry-url: 'https://registry.npmjs.org'

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist

      - name: Publish
        run: npm publish ./dist
