name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # macOS and Windows minutes cost more, so the engines floor from package.json runs on Linux only.
        include:
          - { os: ubuntu-latest, node: '22.18' }
          - { os: ubuntu-latest, node: '26' }
          - { os: macos-latest, node: '26' }
          - { os: windows-latest, node: '26' }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Find the runner's own Chrome without CHROME_PATH
        run: |
          node --input-type=module -e "const { findChrome } = await import('./src/serve.ts'); const chrome = findChrome(); console.log(chrome ?? 'no Chrome found'); if (!chrome) process.exitCode = 1"
        env:
          CHROME_PATH: ''

      # Page tests stall under Chrome for Testing on the macOS runners, so macOS keeps the runner's own Chrome.
      - uses: browser-actions/setup-chrome@v2
        if: runner.os != 'macOS'
        id: chrome

      # Ubuntu 24.04 denies unprivileged user namespaces to programs without an AppArmor profile, and Chrome's sandbox needs them.
      - name: Let Chrome's sandbox run
        if: runner.os == 'Linux'
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: Typecheck
        run: npx tsc -p .

      - name: Test
        run: npm test
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}

      - name: Check every game
        run: |
          status=0
          for dir in games/*/; do
            npx fourjs check "${dir%/}" || status=1
          done
          exit "$status"

  package:
    name: Package with Node ${{ matrix.node }} on Linux
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['22.18', '26']
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - uses: browser-actions/setup-chrome@v2
        id: chrome

      - name: Let Chrome's sandbox run
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: Build, pack, install, and use the package
        run: npm run test:package
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
