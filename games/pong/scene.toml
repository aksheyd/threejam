[[entity]]
name = "game"
script = { file = "game.lua", win_score = 7 }

# Paddles come before the ball, so the ball collides with where they are this tick.
[[entity]]
name = "left_paddle"
transform = { position = [-1.85, 0.0], scale = [0.08, 0.45] }
mesh = { shape = "square", color = [0.95, 0.95, 0.95] }
script = { file = "paddle.lua", up = "W", down = "S", speed = 2.2 }

[[entity]]
name = "right_paddle"
transform = { position = [1.85, 0.0], scale = [0.08, 0.45] }
mesh = { shape = "square", color = [0.95, 0.95, 0.95] }
script = { file = "paddle.lua", up = "Up", down = "Down", speed = 2.2 }

# serve_pause is in ticks (60 per second).
[[entity]]
