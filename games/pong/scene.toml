# game.lua sets the scores and shows the other texts only while waiting for Space.
[[entity]]
name = "left_score"
transform = { position = [-0.5, 1.2] }
text = { value = "0", size = 0.28, color = [0.5, 0.5, 0.5] }

[[entity]]
name = "right_score"
transform = { position = [0.5, 1.2] }
text = { value = "0", size = 0.28, color = [0.5, 0.5, 0.5] }

[[entity]]
name = "winner"
transform = { position = [0.0, 0.5] }
text = { value = "", size = 0.14, color = [0.95, 0.95, 0.95] }

[[entity]]
name = "prompt"
transform = { position = [0.0, -0.5] }
text = { value = "PRESS SPACE TO START", size = 0.14, color = [0.95, 0.95, 0.95] }

[[entity]]
name = "left_keys"
transform = { position = [-1.0, -1.0] }
